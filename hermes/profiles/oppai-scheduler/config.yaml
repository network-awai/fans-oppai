# Host-local blocks (command_allowlist, onboarding, secrets, skills, terminal) are kept on the host and omitted here.
providers:
  murakumo:
    base_url: https://api.murakumo.cloud/v1
    api_mode: chat_completions
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    models:
      mishima:
        context_length: 131072
        max_tokens: 1024
      nex-n2.5-mini-uncensored:
        context_length: 65536
        max_tokens: 8192
      qwen3-vl-2b-instruct:
        context_length: 4096
        max_tokens: 512
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
    extra_headers:
      HTTP-Referer: https://itonami.cloud
      X-Title: Itonami By KotobaLabs
model:
  provider: murakumo
  base_url: https://api.murakumo.cloud/v1
  key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
  default: mishima
  max_tokens: 1024
  context_length: 131072
auxiliary:
  vision:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: qwen3-vl-2b-instruct
    reasoning_effort: none
    fallback_chain: []
  web_extract:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    fallback_chain: []
  compression:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    reasoning_effort: none
    fallback_chain: []
  skills_hub:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    fallback_chain: []
  approval:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    fallback_chain: []
  mcp:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    fallback_chain: []
  title_generation:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    reasoning_effort: none
    fallback_chain: []
  triage_specifier:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    fallback_chain: []
fallback_providers: []
plugins:
  enabled: []
_config_version: 46
agent:
  max_turns: 500
  run_budget_seconds: 600



cron:
  bot_chat_delivery_timeout_seconds: 900
  max_parallel_jobs: 12
gateway:
  cron_only: true
mcp_servers:
  github-forest:
    command: /opt/homebrew/bin/node
    args:
      - ${userHome}/github/com-junkawasaki/west-manifest/scripts/forest-maintenance.mjs
      - mcp
    lazy: true
