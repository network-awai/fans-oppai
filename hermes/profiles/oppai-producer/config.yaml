# Host-local blocks (command_allowlist, onboarding, secrets, skills, terminal) are kept on the host and omitted here.
moa:
  presets:
    default:
      reference_models:
      - provider: murakumo
        model: mishima
        enabled: false
      degraded_reference_policy: loud
      fanout: user_turn
      aggregator:
        provider: murakumo
        model: mishima
  reference_models:
  - provider: murakumo
    model: mishima
    enabled: false
  aggregator:
    provider: murakumo
    model: mishima
  degraded_reference_policy: loud
  fanout: user_turn
  enabled: false
model:
  provider: murakumo
  base_url: https://api.murakumo.cloud/v1
  default: mishima
  max_tokens: 8192
  context_length: 131072
providers:
  murakumo:
    base_url: https://api.murakumo.cloud/v1
    api_mode: chat_completions
    models:
      mishima:
        context_length: 131072
        max_tokens: 2048
      qwen3-vl-2b-instruct:
        context_length: 4096
        max_tokens: 512
    stale_timeout_seconds: 600
    request_timeout_seconds: 150
    extra_headers:
      HTTP-Referer: https://itonami.cloud
      X-Title: Itonami By KotobaLabs
    key_env: MURAKUMO_API_TOKEN
fallback_providers: []
agent:
  max_turns: 60
  run_budget_seconds: 600
auxiliary:
  free_only: true
  vision:
    provider: murakumo
    model: qwen3-vl-2b-instruct
  compression:
    provider: murakumo
    model: mishima
  skills_hub:
    provider: murakumo
    model: mishima
  approval:
    provider: murakumo
    model: mishima
  mcp:
    provider: murakumo
    model: mishima
  title_generation:
    provider: murakumo
    model: mishima
  triage_specifier:
    provider: murakumo
    model: mishima
  web_extract:
    base_url: https://api.kotoba.cloud/v1
    model: mishima
    provider: murakumo
plugins:
  enabled: []
cron:
  max_parallel_jobs: 12
  bot_chat_delivery_timeout_seconds: 900
  script_timeout_seconds: 1200
_config_version: 46
mcp_servers:
  oppai-producer:
    command: /opt/homebrew/bin/kbb
    args:
    - --backend
    - sci
    - --classpath
    - ~/github/.oppai-producer-runtime/orgs/network-awai/fans-oppai/scripts:~/github/.oppai-producer-runtime/orgs/network-awai/fans-oppai/src
    - ~/github/.oppai-producer-runtime/orgs/network-awai/fans-oppai/scripts/producer_mcp.cljk
    env:
      OPPAI_REPO: ~/github/.oppai-producer-runtime/orgs/network-awai/fans-oppai
    timeout: 600
gateway:
  cron_only: true
platform_toolsets:
  cron:
  - terminal
  - file
  - vision
  - mcp-oppai-producer
